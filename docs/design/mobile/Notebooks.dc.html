<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notebooks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 0 20px; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 20px 10px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.4px">Notebooks</h1>
<span style="font-size: 14px; color: #5C5C5C">6 notebooks · 42 notes</span>
</div>
<button type="button" aria-label="New notebook" style="height: 44px; padding: 0 4px; border: none; background: transparent; color: #B01A31; font-family: inherit; font-size: 15px; font-weight: 600">New</button>
</div>
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 20px 6px; overflow: hidden">
<sc-for list="{{books}}" as="b" hint-placeholder-count="6">
<a href="Notebook.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 60px; border-bottom: 1px solid #EEECE8; color: #171717; text-decoration: none">
<span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #F6F5F2; color: #5C5C5C; display: flex; align-items: center; justify-content: center; font-size: 21px"><span style="display: {{b.emojiShow}}">{{b.emoji}}</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" stroke-width="1.9" style="display: {{b.iconShow}}"><path d="M6 4h11a2 2 0 012 2v14H8a2 2 0 01-2-2z M6 18a2 2 0 012-2h11"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 16px; font-weight: 500">{{b.name}}</span><span style="font-size: 13px; color: #5C5C5C">{{b.meta}}</span></span>
<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" stroke-width="2" style="color: #5C5C5C"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
<span style="padding: 18px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">TAGS</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="5">
<a href="Search.dc.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 12px; background: #F6F5F2; color: #171717; font-size: 14px; font-weight: 500; text-decoration: none"><span>{{t.name}}</span><span style="font-weight: 400; color: #5C5C5C">{{t.count}}</span></a>
</sc-for>
</div>
<a href="Settings.dc.html" style="margin-top: auto; display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 13px; font-weight: 500; color: #3D3D3D; text-decoration: none"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #1F7A4D"></span><span style="flex-grow: 1">home-server · synced</span><span style="color: #B01A31">Settings</span></a>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px 12px 0; border-top: 1px solid #EEECE8; background: #FFFFFF">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
<a href="{{tab.href}}" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{tab.ink}}; font-size: 11px; font-weight: {{tab.weight}}"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" stroke-width="1.9"><path d="{{tab.d}}"></path></svg><span>{{tab.label}}</span></a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
function tabs(active) {
return [['Notes', 'Main.dc.html', 'M7 3h8l4 4v14H7z M15 3v4h4 M10 12h6 M10 16h6'], ['Notebooks', 'Notebooks.dc.html', 'M6 4h11a2 2 0 012 2v14H8a2 2 0 01-2-2z M6 18a2 2 0 012-2h11 M10 8h5'], ['Search', 'Search.dc.html', 'M11 4a7 7 0 100 14 7 7 0 000-14z M20 20l-4-4']].map(function (t) {
var on = t[0] === active;
return { label: t[0], href: t[1], d: t[2], ink: on ? '#B01A31' : '#5C5C5C', weight: on ? 600 : 500 };
});
}

function book(emoji, name, meta) { return { emoji: emoji, name: name, meta: meta, emojiShow: emoji ? 'inline' : 'none', iconShow: emoji ? 'none' : 'block' }; }
return {
tabs: tabs('Notebooks'),
books: [
book('🏠', 'Home', '12 notes · edited today'),
book('💼', 'Work', '14 notes · edited Mon'),
book('📚', 'Reading', '6 notes · edited 18 Nov'),
book('✈️', 'Travel', '4 notes · edited 9 Nov'),
book('💡', 'Ideas', '4 notes · edited 2 Nov'),
book("", 'Recipes', '2 notes · no icon yet')
],
tags: [['#renovation', '4'], ['#meeting', '7'], ['#book', '6'], ['#idea', '5'], ['#recipe', '2']].map(function (t) { return { name: t[0], count: t[1] }; })
};
}
}
</script>
</body>
</html>
