<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link to a note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 0 20px; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px">
<a href="Main.dc.html" aria-label="Back to notes" style="width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; color: #171717; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" stroke-width="2"><path d="M15 5l-7 7 7 7"></path></svg></a>
<a href="Notebooks.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 15px; font-weight: 500; color: #3D3D3D; text-decoration: none"><span aria-hidden="true">🏠</span>Home</a>
<span style="margin-left: auto; padding-right: 4px; font-size: 13px; color: #5C5C5C">Editing</span>
<button type="button" aria-label="Pin note" style="width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; color: #171717; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" stroke-width="1.9"><path d="M9 4h6l-1 6 3 3H7l3-3z M12 13v7"></path></svg></button>
<button type="button" aria-label="More actions" style="width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; color: #171717; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" stroke-width="3"><path d="M5 12h.01 M12 12h.01 M19 12h.01"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 8px 22px 0">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 28px; line-height: 34px; letter-spacing: -0.4px">Kitchen renovation</h1>
<p style="margin: 0; font-size: 16px; line-height: 26px">Goal: a working kitchen before March. Money and contractor choices live in <span style="padding: 2px 6px; border-radius: 6px; background: #FCEBEE; color: #8C1427; font-weight: 500">[[bud</span><span aria-hidden="true" style="display: inline-block; width: 2px; height: 22px; margin-left: 1px; background: #D4213D; vertical-align: text-bottom"></span></p>
</div>
<div role="dialog" aria-label="Link to a note" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 16px 28px; border-radius: 20px 20px 0 0; border-top: 1px solid #E4E2DD; background: #FFFFFF; box-shadow: 0 -10px 30px rgba(23,23,23,0.12); display: flex; flex-direction: column; gap: 10px">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #D9D6D0"></span>
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px">Link to a note</h2>
<a href="Note.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; color: #171717; display: flex; align-items: center; justify-content: center; padding: 0; margin-right: -10px"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{results}}" as="r" hint-placeholder-count="3">
<a href="Note.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 10px; border-radius: 12px; background: {{r.bg}}; color: #171717; text-decoration: none">
<span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: {{r.iconBg}}; display: flex; align-items: center; justify-content: center; font-size: 18px">{{r.emoji}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 16px; font-weight: 500">{{r.title}}</span><span style="font-size: 13px; color: #5C5C5C">{{r.meta}}</span></span>
</a>
</sc-for>
<button type="button" style="display: flex; align-items: center; gap: 12px; height: 58px; margin-top: 4px; padding: 0 10px; border: none; border-top: 1px solid #EEECE8; background: transparent; color: #B01A31; font-family: inherit; font-size: 16px; font-weight: 500; text-align: left"><span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #FCEBEE; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" stroke-width="2.2"><path d="M12 5v14M5 12h14"></path></svg></span>Create note “bud”</button>
</div>
<p style="margin: 0; font-size: 13px; line-height: 19px; color: #5C5C5C">The other note will list this one under Linked from.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
results: [
['🏠', 'Budget 2027', 'Home · edited yesterday', true],
['💼', 'Budget template', 'Work · edited 3 Nov', false],
['✈️', 'Budapest weekend', 'Travel · edited 14 Oct', false]
].map(function (r) { return { emoji: r[0], title: r[1], meta: r[2], bg: r[3] ? '#F6F5F2' : 'transparent', iconBg: r[3] ? '#FFFFFF' : '#F6F5F2' }; })
};
}
}
</script>
</body>
</html>
